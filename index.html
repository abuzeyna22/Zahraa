<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>بوابة الزهراء للتطوير العقاري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9; --container-bg: #ffffff; --text-color: #1e293b;
            --sidebar-bg: #ffffff; --header-color: #0f172a; --border-color: #e2e8f0; --primary-color: #0d9488;
            --danger-color: #ef4444; --success-color: #10b981; --warning-color: #f59e0b;
            --purple-color: #805ad5; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --logo-box-bg: #f8fafc; 
        }
        .dark-mode {
            --bg-color: #0f172a; --container-bg: #1e293b; --text-color: #cbd5e0;
            --sidebar-bg: #1e293b; --header-color: #f1f5f9; --border-color: #334155; --primary-color: #14b8a6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
            --logo-box-bg: #334155; 
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; transition: 0.4s; display: flex; height: 100vh; overflow: hidden; }
        input, textarea { touch-action: manipulation; }

        /* Login */
        .login-overlay { display: flex; position: fixed; inset: 0; background: var(--bg-color); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: var(--container-bg); padding: 40px; border-radius: 16px; box-shadow: var(--shadow); width: 90%; max-width: 350px; text-align: center; }
        .logos-box { display: flex; flex-direction: column; align-items: center; gap: 15px; margin-bottom: 25px; padding: 20px; background: var(--logo-box-bg); border-radius: 12px; border: 1px solid var(--border-color); }
        .logos-box .zahraa-logo { height: 65px; object-fit: contain; }
        .flux-wrapper { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .flux-wrapper .flux-logo { height: 35px; object-fit: contain; background: #ffffff; padding: 3px 10px; border-radius: 6px; border: 1px solid var(--border-color); }
        .flux-credit { font-size: 10px; opacity: 0.6; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-color); box-sizing: border-box; font-family: 'Cairo'; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; font-family: 'Cairo'; background: var(--primary-color); color: white; transition: 0.2s; width: 100%; }
        .btn:hover { opacity: 0.9; }
        .btn-danger { background: var(--danger-color); }
        .error-msg { color: var(--danger-color); font-size: 13px; margin-top: 10px; display: none; }

        /* Sidebar */
        .sidebar { width: 250px; background: var(--sidebar-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px 0; transition: width 0.3s ease, transform 0.3s ease; overflow: hidden; white-space: nowrap; position: relative; z-index: 100; }
        .sidebar.collapsed { width: 70px; }
        .sidebar.collapsed .hide-on-collapse { display: none !important; }
        .sidebar.collapsed .show-on-collapse { display: block !important; }
        .show-on-collapse { display: none; }
        .sidebar.collapsed .nav-link { justify-content: center; padding: 15px; }
        .sidebar.collapsed .user-profile { padding: 15px 5px; }
        .sidebar.collapsed .sidebar-header { padding: 0 5px 15px; }
        .sidebar.collapsed .logout-btn { padding: 12px 5px; font-size: 20px; }
        .sidebar-header { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 0 20px 20px; border-bottom: 1px solid var(--border-color); }
        .zahraa-logo { height: 40px; object-fit: contain; }
        .flux-logo { height: 28px; object-fit: contain; background: #ffffff; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border-color); }
        .user-profile { padding: 20px; text-align: center; border-bottom: 1px solid var(--border-color); }
        .user-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; margin: 0 auto 10px; display: block; background: var(--bg-color); }
        .user-name { font-weight: 700; font-size: 15px; }
        .user-role { font-size: 12px; color: var(--primary-color); font-weight: 600; }
        .nav-links { flex-grow: 1; padding: 20px 10px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--text-color); margin-bottom: 5px; transition: 0.2s; }
        .nav-link:hover { background: var(--bg-color); }
        .nav-link.active { background: var(--primary-color); color: white; }
        .logout-btn { margin: 10px; padding: 12px; }

        /* Main Content */
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--border-color); background: var(--container-bg); flex-shrink: 0; }
        .topbar-left { display: flex; align-items: center; gap: 20px; }
        .menu-toggle { background: none; border: 1px solid var(--border-color); border-radius: 8px; font-size: 20px; cursor: pointer; color: var(--text-color); padding: 5px 15px; }
        
        /* View Container (Updated for Flexbox) */
        .view { flex-grow: 1; overflow-y: auto; padding: 30px; display: none; position: relative; min-height: 0; }
        .view.active { display: flex; flex-direction: column; }

        /* Dashboard */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--container-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); text-align: center; border-top: 4px solid var(--primary-color); }
        .stat-card h4 { margin: 0 0 10px 0; font-size: 14px; opacity: 0.8; }
        .stat-card .value { font-size: 28px; font-weight: 800; color: var(--primary-color); }
        .urgent-list { background: var(--container-bg); padding: 20px; border-radius: 12px; box-shadow: var(--shadow); }
        .urgent-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid var(--border-color); }

        /* Tasks Board & Arrows */
        .tasks-view-wrapper { position: relative; height: 100%; flex-grow: 1; }
        .tasks-grid { display: flex; gap: 15px; min-width: max-content; padding-bottom: 20px; height: 100%; overflow-x: auto; scroll-behavior: smooth; }
        .tasks-grid::-webkit-scrollbar { display: none; }
        .column { width: 280px; flex-shrink: 0; background: var(--bg-color); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 75vh; }
        .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .column-title { font-size: 15px; font-weight: 700; margin: 0; }
        .count-badge { background: var(--border-color); color: var(--text-color); padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .column-content { overflow-y: auto; flex-grow: 1; padding-left: 5px; }
        .empty-state { font-size: 13px; opacity: 0.5; text-align: center; padding: 20px 0; }
        .task-card { background: var(--container-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: var(--shadow); cursor: pointer; transition: 0.2s; border-right: 4px solid var(--primary-color); }
        .task-card:hover { transform: translateY(-2px); }
        .task-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
        .task-meta { font-size: 12px; opacity: 0.8; margin-bottom: 5px; display: flex; align-items: center; gap: 5px; }
        .tag { display: inline-block; background: var(--border-color); color: var(--text-color); padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px; font-weight: 600; }
        .fab { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background-color: var(--primary-color); border-radius: 50%; box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4); display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; color: white; font-size: 32px; z-index: 90; }

        /* Navigation Arrows */
        .nav-arrow { position: absolute; top: 50%; transform: translateY(-50%); background: var(--primary-color); color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 24px; cursor: pointer; z-index: 50; box-shadow: var(--shadow); display: none; align-items: center; justify-content: center; opacity: 0.9; }
        .nav-arrow:hover { opacity: 1; }
        .nav-arrow.left { left: 0; }
        .nav-arrow.right { right: 0; }

        /* Chat (Fixed Mobile Viewport) */
        .chat-container { display: flex; flex-direction: column; flex-grow: 1; min-height: 0; background: var(--container-bg); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
        .chat-messages { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; min-height: 0; }
        .chat-msg { display: flex; gap: 10px; max-width: 70%; position: relative; }
        .chat-msg.me { flex-direction: row-reverse; align-self: flex-end; }
        .chat-msg img.avatar { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
        .msg-bubble { position: relative; background: var(--bg-color); padding: 10px 15px; border-radius: 12px; max-width: 100%; }
        .chat-msg.me .msg-bubble { background: var(--primary-color); color: white; }
        .msg-author { font-size: 12px; font-weight: 700; margin-bottom: 4px; opacity: 0.8; }
        .msg-time { font-size: 10px; opacity: 0.6; margin-top: 4px; text-align: left; }
        .chat-msg.me .msg-time { text-align: right; }
        .msg-text { font-size: 14px; word-break: break-word; }
        .msg-text a { color: var(--primary-color); text-decoration: underline; font-weight: bold; }
        .chat-msg.me .msg-text a { color: #ffffff; text-decoration: underline; }
        .msg-img { max-width: 200px; max-height: 200px; object-fit: cover; border-radius: 8px; margin-top: 5px; cursor: pointer; display: block; }
        .msg-footer { display: flex; gap: 10px; margin-top: 5px; opacity: 0; transition: opacity 0.2s; }
        .chat-msg:hover .msg-footer { opacity: 0.5; }
        .msg-footer button { background: none; border: none; cursor: pointer; font-size: 12px; padding: 0; opacity: 0.8; color: var(--text-color); }
        .chat-msg.me .msg-footer button { color: white; }
        .react-popup { position: absolute; bottom: 100%; left: 0; background: var(--container-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 5px; display: none; gap: 5px; box-shadow: var(--shadow); z-index: 10; }
        .react-popup button { font-size: 16px; background: none; border: none; cursor: pointer; }
        .msg-reacts { margin-top: 5px; font-size: 12px; display: flex; gap: 5px; }
        
        /* Chat Input Fixed Bottom */
        .chat-input-area { flex-shrink: 0; padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; background: var(--container-bg); z-index: 50; }
        .chat-input-area input[type="text"] { flex-grow: 1; margin: 0; }

        /* Settings */
        .settings-container { max-width: 600px; margin: 0 auto; background: var(--container-bg); padding: 30px; border-radius: 12px; box-shadow: var(--shadow); }
        .form-group { margin-bottom: 20px; }
        label { font-weight: 600; margin-bottom: 8px; display: block; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-color); font-family: 'Cairo'; box-sizing: border-box; }
        input:disabled, select:disabled, textarea:disabled { opacity: 0.6; cursor: not-allowed; }
        .platforms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--container-bg); padding: 25px; border-radius: 12px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn-cancel { background: var(--border-color); color: var(--text-color); }
        .btn-success { background: var(--success-color); color: white; }
        .btn-warning { background: var(--warning-color); color: white; }
        .comment-box { background: var(--bg-color); padding: 10px; border-radius: 6px; margin-bottom: 8px; border: 1px solid var(--border-color); }
        .comment-author { font-size: 12px; font-weight: 700; color: var(--primary-color); }
        .comment-time { font-size: 10px; opacity: 0.6; }
        .comment-text { font-size: 13px; margin-top: 4px; }
        .comment-text a { color: var(--primary-color); text-decoration: underline; }
        .details-body a { color: var(--primary-color); font-weight: bold; word-break: break-all; }
        .creator-badge { background: var(--bg-color); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { position: fixed; right: 0; top: 0; height: 100%; transform: translateX(100%); box-shadow: -5px 0 15px rgba(0,0,0,0.2); width: 250px !important; }
            .sidebar.mobile-open { transform: translateX(0); }
            .sidebar.collapsed { width: 250px !important; }
            .main-content { width: 100%; }
            .nav-arrow { display: flex; }
            .column { width: 85vw; max-height: 60vh; }
            .chat-msg { max-width: 85%; }
            .topbar { padding: 10px 15px; }
            .view { padding: 15px; }
            .modal-content { padding: 15px; }
        }
    </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-overlay" id="loginScreen">
    <div class="login-box">
        <div class="logos-box">
            <img src="https://alzahraadevelopment.com/wp-content/uploads/2024/12/zahra-logo3-1.png" alt="Zahraa" class="zahraa-logo">
            <div class="flux-wrapper">
                <span class="flux-credit">Powered by</span>
                <img src="https://iili.io/CD6dcqg.png" alt="Flux" class="flux-logo">
            </div>
        </div>
        <h3 style="margin-top: 0;">بوابة المهام</h3>
        <input type="email" id="emailInput" class="login-input" placeholder="البريد الإلكتروني">
        <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور">
        <button class="btn" onclick="login()">دخول</button>
        <div class="error-msg" id="loginError">بيانات الدخول غير صحيحة</div>
    </div>
</div>

<!-- Main App Layout -->
<div class="sidebar" id="appSidebar" style="display: none;">
    <div class="sidebar-header">
        <img src="https://alzahraadevelopment.com/wp-content/uploads/2024/12/zahra-logo3-1.png" alt="Zahraa" class="zahraa-logo">
        <img src="https://iili.io/CD6dcqg.png" alt="Flux" class="flux-logo hide-on-collapse">
    </div>
    <div class="user-profile">
        <img id="userAvatar" class="user-avatar" src="https://via.placeholder.com/60?text=U">
        <div class="hide-on-collapse">
            <div class="user-name" id="userName">مستخدم</div>
            <div class="user-role" id="userRole">زائر</div>
        </div>
    </div>
    <div class="nav-links">
        <div class="nav-link active" onclick="navigate('dashboard', this)">
            <span>📊</span> <span class="hide-on-collapse">لوحة التحكم</span>
        </div>
        <div class="nav-link" onclick="navigate('tasks', this)">
            <span>📋</span> <span class="hide-on-collapse">المهام</span>
        </div>
        <div class="nav-link" onclick="navigate('chat', this)">
            <span>💬</span> <span class="hide-on-collapse">الدردشة</span>
        </div>
        <div class="nav-link" onclick="navigate('settings', this)">
            <span>⚙️</span> <span class="hide-on-collapse">الإعدادات</span>
        </div>
    </div>
    <button class="btn btn-danger logout-btn" onclick="logout()">
        <span class="hide-on-collapse">تسجيل الخروج</span>
        <span class="show-on-collapse">🚪</span>
    </button>
</div>

<div class="main-content" id="appMain" style="display: none;">
    <div class="topbar">
        <div class="topbar-left">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2 id="viewTitle" style="margin:0;">لوحة التحكم</h2>
        </div>
        <button class="btn" style="width: auto; padding: 8px 15px; background: var(--container-bg); color: var(--text-color); border: 1px solid var(--border-color);" onclick="toggleDarkMode()" id="darkModeBtn">🌙</button>
    </div>

    <!-- Dashboard View -->
    <div class="view active" id="view-dashboard">
        <div class="stats-grid" id="statsGrid"></div>
        <div class="urgent-list">
            <h3>المهام العاجلة والمتأخرة</h3>
            <div id="urgentList"></div>
        </div>
    </div>

    <!-- Tasks View -->
    <div class="view" id="view-tasks" style="padding: 15px;">
        <div class="tasks-view-wrapper">
            <button class="nav-arrow left" onclick="scrollTasks(-1)">‹</button>
            <button class="nav-arrow right" onclick="scrollTasks(1)">›</button>
            <div class="tasks-grid" id="tasksGrid">
                <div class="column"><div class="column-header"><h3 class="column-title">محتوى مطلوب</h3><span class="count-badge" id="count-1">0</span></div><div class="column-content" id="col-1"></div></div>
                <div class="column"><div class="column-header"><h3 class="column-title">قيد التنفيذ</h3><span class="count-badge" id="count-2">0</span></div><div class="column-content" id="col-2"></div></div>
                <div class="column"><div class="column-header"><h3 class="column-title">مراجعة الأدمن</h3><span class="count-badge" id="count-3">0</span></div><div class="column-content" id="col-3"></div></div>
                <div class="column"><div class="column-header"><h3 class="column-title">مراجعة العميل</h3><span class="count-badge" id="count-4">0</span></div><div class="column-content" id="col-4"></div></div>
                <div class="column"><div class="column-header"><h3 class="column-title">معتمد من العميل</h3><span class="count-badge" id="count-5">0</span></div><div class="column-content" id="col-5"></div></div>
                <div class="column"><div class="column-header"><h3 class="column-title">تم النشر</h3><span class="count-badge" id="count-6">0</span></div><div class="column-content" id="col-6"></div></div>
            </div>
        </div>
        <button class="fab" onclick="openTaskModal()" id="fabAdd">+</button>
    </div>

    <!-- Chat View -->
    <div class="view" id="view-chat" style="padding: 0;">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-area">
                <input type="file" id="chatImgInput" accept="image/*" style="display: none" onchange="uploadChatImage()">
                <button class="btn" style="width: auto; padding: 10px;" onclick="document.getElementById('chatImgInput').click()">📷</button>
                <input type="text" id="chatTextInput" placeholder="اكتب رسالة..." onfocus="this.scrollIntoView()" onkeypress="if(event.key==='Enter') sendChat()">
                <button class="btn" style="width: auto; padding: 10px;" onclick="sendChat()">➤</button>
            </div>
        </div>
    </div>

    <!-- Settings View -->
    <div class="view" id="view-settings">
        <div class="settings-container">
            <h3>الإعدادات</h3>
            <div class="form-group">
                <label>الصورة الشخصية</label>
                <div style="display: flex; align-items: center; gap: 20px;">
                    <img id="settingsAvatar" class="user-avatar" src="https://via.placeholder.com/80?text=U" style="width: 80px; height: 80px;">
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;" onchange="uploadAvatar()">
                    <button class="btn" style="width: auto; padding: 10px;" onclick="document.getElementById('avatarInput').click()">تغيير الصورة</button>
                </div>
            </div>
            <div class="form-group">
                <label>تغيير كلمة المرور</label>
                <input type="password" id="newPassInput" placeholder="كلمة المرور الجديدة">
            </div>
            <button class="btn btn-success" onclick="updateProfile()">حفظ الإعدادات</button>
        </div>
    </div>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="taskModal">
    <div class="modal-content">
        <h3>إنشاء مهمة جديدة</h3>
        <div class="form-group"><label>عنوان المهمة</label><input type="text" id="taskTitle"></div>
        <div class="form-group"><label>نوع المهمة</label>
            <select id="taskType"><option value="انشاءات">انشاءات</option><option value="ستوري">ستوري</option><option value="ريل">ريل</option><option value="ريفيو عميل">ريفيو عميل</option><option value="أخرى">أخرى</option></select>
        </div>
        <div class="form-group"><label>المنصات</label>
            <div class="platforms-grid">
                <label><input type="checkbox" value="فيسبوك"> فيسبوك</label>
                <label><input type="checkbox" value="انستجرام"> انستجرام</label>
                <label><input type="checkbox" value="يوتيوب"> يوتيوب</label>
                <label><input type="checkbox" value="تيك توك"> تيك توك</label>
                <label><input type="checkbox" value="الويبسايت"> الويبسايت</label>
                <label><input type="checkbox" value="أخرى"> أخرى</label>
            </div>
        </div>
        <div class="form-group"><label>الوصف المطلوب</label><textarea id="taskDesc" rows="3"></textarea></div>
        <div class="form-group"><label>تاريخ النشر المطلوب</label><input type="date" id="taskDate"></div>
        <div class="form-group"><label>رابط الخامات (Drive)</label><input type="url" id="taskRawLink" placeholder="https://..."></div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal('taskModal')">إلغاء</button>
            <button class="btn btn-success" onclick="addTask()">حفظ المهمة</button>
        </div>
    </div>
</div>

<!-- Task Details Modal -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
        <h3 id="detailsTitle"></h3>
        <div id="detailsBody" class="details-body"></div>
        <div class="modal-actions" id="detailsActions"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwMDdRgkELmkMxniu9jRlNMDvcc6ttfzFwusx_-zPsyMre4KBBLQaJKSHKqwGv3YCc/exec";
    const IMG_API_KEY = "71307118640265da76172e90445b208b";
    const STATUS_MAP = { "محتوى مطلوب": 1, "قيد التنفيذ": 2, "مراجعة الأدمن": 3, "مراجعة العميل": 4, "معتمد من العميل": 5, "تم النشر": 6 };
    
    let currentUser = null;
    let boardData = { tasks: [], comments: [], chat: [], users: [] };

    if (localStorage.getItem('zahraaDark') === 'true') {
        document.body.classList.add('dark-mode');
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('darkModeBtn').innerText = '☀️';
        });
    }

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem('zahraaDark', isDark);
        document.getElementById('darkModeBtn').innerText = isDark ? '☀️' : '🌙';
    }

    function toggleSidebar() {
        const sb = document.getElementById('appSidebar');
        if (window.innerWidth <= 768) {
            sb.classList.toggle('mobile-open');
        } else {
            sb.classList.toggle('collapsed');
            localStorage.setItem('sbCollapsed', sb.classList.contains('collapsed'));
        }
    }

    if (localStorage.getItem('sbCollapsed') === 'true') {
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('appSidebar').classList.add('collapsed');
        });
    }

    function scrollTasks(direction) {
        const grid = document.getElementById('tasksGrid');
        const scrollAmount = window.innerWidth * 0.85;
        grid.scrollBy({ left: direction * scrollAmount, behavior: 'smooth' });
    }

    function navigate(viewId, el) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(`view-${viewId}`).classList.add('active');
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        el.classList.add('active');
        const titles = { dashboard: 'لوحة التحكم', tasks: 'المهام', chat: 'الدردشة', settings: 'الإعدادات' };
        document.getElementById('viewTitle').innerText = titles[viewId];
        if (window.innerWidth <= 768) {
            document.getElementById('appSidebar').classList.remove('mobile-open');
        }
    }

    async function login(autoEmail, autoPass) {
        const email = autoEmail || document.getElementById('emailInput').value;
        const pass = autoPass || document.getElementById('passInput').value;
        document.getElementById('loginError').style.display = 'none';
        try {
            const res = await fetch(`${API_URL}?action=login&email=${email}&password=${pass}`);
            const data = await res.json();
            if (data.status === 'success') {
                currentUser = data.user;
                currentUser.password = pass;
                localStorage.setItem('zahraaUser', JSON.stringify({ email: email, password: pass }));
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appSidebar').style.display = 'flex';
                document.getElementById('appMain').style.display = 'flex';
                initUserUI();
                fetchData();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        } catch (e) { document.getElementById('loginError').style.display = 'block'; }
    }

    window.onload = function() {
        const savedUser = localStorage.getItem('zahraaUser');
        if (savedUser) {
            const u = JSON.parse(savedUser);
            login(u.email, u.password);
        }
    };

    function logout() {
        localStorage.removeItem('zahraaUser');
        location.reload();
    }

    function initUserUI() {
        document.getElementById('userName').innerText = currentUser.Name;
        document.getElementById('userRole').innerText = currentUser.Role === 'Admin' ? 'مدير النظام' : (currentUser.Role === 'Mustafa' ? 'مونتير' : 'عميل');
        document.getElementById('settingsAvatar').src = currentUser.Avatar || 'https://via.placeholder.com/80?text=U';
        document.getElementById('userAvatar').src = currentUser.Avatar || 'https://via.placeholder.com/60?text=U';
    }

    async function fetchData() {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API_URL}?action=getBoardData&email=${currentUser.Email}&password=${currentUser.password}`);
            const data = await res.json();
            if (data.status === 'success') {
                boardData = data;
                renderDashboard();
                renderTasks();
                renderChat();
            }
        } catch (e) { console.error(e); }
    }
    setInterval(fetchData, 5000);

    function formatTime(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d)) return '';
        let hours = d.getHours();
        let mins = d.getMinutes();
        hours = hours < 10 ? '0' + hours : hours;
        mins = mins < 10 ? '0' + mins : mins;
        let day = d.getDate();
        let month = d.getMonth() + 1;
        return `${hours}:${mins} - ${day}/${month}`;
    }

    function getDeadlineInfo(deadline) {
        if(!deadline) return { emoji: '', text: 'غير محدد', class: '' };
        const today = new Date(); today.setHours(0,0,0,0);
        const d = new Date(deadline); d.setHours(0,0,0,0);
        const diff = Math.round((d - today) / (1000 * 60 * 60 * 24));
        if (diff < 0) return { emoji: '🔴', text: `متأخر (${d.toLocaleDateString('ar-EG')})`, class: 'late' };
        if (diff === 0) return { emoji: '⏰', text: 'اليوم!', class: 'today' };
        if (diff === 1) return { emoji: '🟡', text: 'غداً', class: 'near' };
        return { emoji: '🟢', text: d.toLocaleDateString('ar-EG'), class: 'far' };
    }

    function renderDashboard() {
        const stats = [0,0,0,0,0,0];
        let urgentHtml = '';
        boardData.tasks.forEach(t => {
            const colNum = STATUS_MAP[t.Status] || 1;
            stats[colNum-1]++;
            const dl = getDeadlineInfo(t.PublishDate);
            if (dl.emoji === '🔴' || dl.emoji === '⏰') {
                urgentHtml += `<div class="urgent-item"><div><strong>${t.Title}</strong><br><small>👤 ${t.Creator}</small></div><div style="text-align: left;"><span style="font-size: 20px;">${dl.emoji}</span><br><small>${dl.text}</small></div></div>`;
            }
        });
        const stages = ["محتوى مطلوب", "قيد التنفيذ", "مراجعة الأدمن", "مراجعة العميل", "معتمد من العميل", "تم النشر"];
        document.getElementById('statsGrid').innerHTML = stages.map((s, i) => `<div class="stat-card"><h4>${s}</h4><div class="value">${stats[i]}</div></div>`).join('');
        document.getElementById('urgentList').innerHTML = urgentHtml || '<div class="empty-state">لا توجد مهام عاجلة حالياً</div>';
    }

    function renderTasks() {
        for (let i = 1; i <= 6; i++) document.getElementById(`col-${i}`).innerHTML = '';
        const counts = [0,0,0,0,0,0];
        boardData.tasks.forEach(t => {
            const colNum = STATUS_MAP[t.Status] || 1;
            counts[colNum-1]++;
            const dl = getDeadlineInfo(t.PublishDate);
            const card = document.createElement('div');
            card.className = 'task-card';
            card.onclick = () => openDetails(t.ID);
            card.innerHTML = `
                <div class="task-title">${t.Title}</div>
                <div class="task-meta">👤 ${t.Creator}</div>
                <div class="task-meta">📅 ${dl.emoji} ${dl.text}</div>
                <div><span class="tag">${t.Type}</span></div>
                <div style="font-size:11px; margin-top:5px; opacity:0.7;">${t.Platforms}</div>
            `;
            document.getElementById(`col-${colNum}`).appendChild(card);
        });
        for (let i = 1; i <= 6; i++) {
            if (counts[i-1] === 0) document.getElementById(`col-${i}`).innerHTML = '<div class="empty-state">لا توجد مهام</div>';
            document.getElementById(`count-${i}`).innerText = counts[i-1];
        }
    }

    function openTaskModal() { document.getElementById('taskModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function addTask() {
        const platforms = Array.from(document.querySelectorAll('.platforms-grid input:checked')).map(c => c.value);
        const payload = {
            action: 'addTask', email: currentUser.Email, password: currentUser.password,
            title: document.getElementById('taskTitle').value, type: document.getElementById('taskType').value,
            platforms: platforms, description: document.getElementById('taskDesc').value,
            publishDate: document.getElementById('taskDate').value, rawLink: document.getElementById('taskRawLink').value
        };
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload) });
        closeModal('taskModal');
        fetchData();
    }

    function openDetails(taskId) {
        const t = boardData.tasks.find(x => x.ID === taskId);
        if (!t) return;
        document.getElementById('detailsTitle').innerText = t.Title;
        const dl = getDeadlineInfo(t.PublishDate);
        
        const canEdit = (currentUser.Role === 'Admin' || t.Creator === currentUser.Name);
        const disabledAttr = canEdit ? '' : 'disabled';
        
        let html = `
            <div class="creator-badge">
                <span>👤 أنشأها: <strong>${t.Creator}</strong></span>
            </div>
            <div class="form-group">
                <label>عنوان المهمة</label>
                <input type="text" id="editTitle" value="${t.Title}" ${disabledAttr}>
            </div>
            <div class="form-group">
                <label>النوع</label>
                <select id="editType" ${disabledAttr}>
                    <option value="انشاءات" ${t.Type === 'انشاءات' ? 'selected' : ''}>انشاءات</option>
                    <option value="ستوري" ${t.Type === 'ستوري' ? 'selected' : ''}>ستوري</option>
                    <option value="ريل" ${t.Type === 'ريل' ? 'selected' : ''}>ريل</option>
                    <option value="ريفيو عميل" ${t.Type === 'ريفيو عميل' ? 'selected' : ''}>ريفيو عميل</option>
                    <option value="أخرى" ${t.Type === 'أخرى' ? 'selected' : ''}>أخرى</option>
                </select>
            </div>
            <div class="form-group">
                <label>المنصات</label>
                <input type="text" id="editPlatforms" value="${t.Platforms}" ${disabledAttr}>
            </div>
            <div class="form-group">
                <label>الوصف</label>
                <textarea id="editDesc" rows="3" ${disabledAttr}>${t.Description}</textarea>
            </div>
            <div class="form-group">
                <label>تاريخ النشر</label>
                <input type="date" id="editPublishDate" value="${t.PublishDate ? new Date(t.PublishDate).toISOString().split('T')[0] : ''}" ${disabledAttr}>
            </div>
            <div class="form-group">
                <label>رابط الخامات (Drive)</label>
                <input type="url" id="editRawLink" value="${t.RawLink || ''}" ${disabledAttr}>
            </div>
            <div class="form-group">
                <label>رابط المعاينة (للمونتير)</label>
                <input type="url" id="reviewLinkInput" value="${t.ReviewLink || ''}" ${disabledAttr}>
            </div>
            <hr>
            <h4>التعليقات</h4>
            <div id="commentsList"></div>
            <div class="form-group" style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="commentInput" placeholder="اكتب تعليقاً...">
                <button class="btn btn-success" style="width: auto; padding: 10px;" onclick="addComment('${t.ID}')">إرسال</button>
            </div>
        `;
        document.getElementById('detailsBody').innerHTML = html;
        
        const comments = boardData.comments.filter(c => c.TaskID === taskId);
        document.getElementById('commentsList').innerHTML = comments.map(c => `
            <div class="comment-box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="comment-author">${c.Name}</span>
                    <span class="comment-time">${formatTime(c.Timestamp)}</span>
                </div>
                <div class="comment-text">${linkify(c.Text)}</div>
            </div>
        `).join('');
        
        let actions = `<button class="btn btn-cancel" onclick="closeModal('detailsModal')">إغلاق</button>`;
        if (canEdit) {
            actions += `<button class="btn btn-success" onclick="saveTaskDetails('${t.ID}')">💾 حفظ التعديلات</button>`;
        }
        
        const currentCol = STATUS_MAP[t.Status];

        if (currentUser.Role === 'Admin') {
            if (currentCol !== 2) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'قيد التنفيذ')">➡️ قيد التنفيذ</button>`;
            if (currentCol !== 3) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'مراجعة الأدمن')">➡️ مراجعة الأدمن</button>`;
            if (currentCol !== 4) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'مراجعة العميل')">➡️ مراجعة العميل</button>`;
            if (currentCol !== 5) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'معتمد من العميل')">➡️ معتمد من العميل</button>`;
            if (currentCol !== 6) actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'تم النشر')">✅ تم النشر</button>`;
        } else if (currentUser.Role === 'Mustafa') {
            if (currentCol < 3) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'مراجعة الأدمن')">رفع للأدمن</button>`;
            if (currentCol === 3) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'مراجعة العميل')">رفع للعميل</button>`;
            if (currentCol === 5) actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'تم النشر')">تأكيد النشر</button>`;
            actions += `<button class="btn btn-warning" onclick="moveTask('${t.ID}', 'قيد التنفيذ')">إعادة للتنفيذ</button>`;
        } else if (currentUser.Role === 'Client') {
            if (currentCol === 4) {
                actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'معتمد من العميل')">اعتماد</button>`;
                actions += `<button class="btn btn-warning" onclick="moveTask('${t.ID}', 'قيد التنفيذ')">طلب تعديل</button>`;
            }
            if (currentCol === 5) {
                actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'تم النشر')">تأكيد النشر</button>`;
            }
        }

        document.getElementById('detailsActions').innerHTML = actions;
        document.getElementById('detailsModal').style.display = 'flex';
    }

    async function saveTaskDetails(taskId) {
        const payload = {
            action: 'updateTaskDetails',
            email: currentUser.Email,
            password: currentUser.password,
            taskId: taskId,
            title: document.getElementById('editTitle').value,
            type: document.getElementById('editType').value,
            platforms: document.getElementById('editPlatforms').value,
            description: document.getElementById('editDesc').value,
            publishDate: document.getElementById('editPublishDate').value,
            rawLink: document.getElementById('editRawLink').value,
            reviewLink: document.getElementById('reviewLinkInput').value
        };
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload) });
        alert('تم حفظ التعديلات بنجاح');
        fetchData();
        closeModal('detailsModal');
    }

    function linkify(inputText) {
        if (!inputText) return '';
        let text = inputText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        let urlPattern = /(\b(https?|ftp):\/\/[-A-Z0-9+&@#\/%?=~_|!:,.;]*[-A-Z0-9+&@#\/%=~_|])/ig;
        text = text.replace(urlPattern, '<a href="$1" target="_blank">$1</a>');
        let wwwPattern = /(^|[^\/])(www\.[\S]+(\b|$))/gim;
        text = text.replace(wwwPattern, '$1<a href="http://$2" target="_blank">$2</a>');
        return text;
    }

    function renderChat() {
        const c = document.getElementById('chatMessages');
        c.innerHTML = boardData.chat.map(m => {
            const isMe = m.Email === currentUser.Email;
            const sender = boardData.users.find(u => u.Email === m.Email) || {};
            const avatar = sender.Avatar || 'https://via.placeholder.com/35?text=U';
            const reacts = JSON.parse(m.Reactions || "{}");
            let reactHtml = Object.entries(reacts).map(([email, emoji]) => emoji).join(" ");
            
            return `
                <div class="chat-msg ${isMe ? 'me' : ''}">
                    <img src="${avatar}" class="avatar">
                    <div class="msg-bubble">
                        <div id="react-popup-${m.ID}" class="react-popup">
                            <button onclick="reactMsg('${m.ID}', '👍')">👍</button>
                            <button onclick="reactMsg('${m.ID}', '❤️')">❤️</button>
                            <button onclick="reactMsg('${m.ID}', '🔥')">🔥</button>
                            <button onclick="reactMsg('${m.ID}', '😂')">😂</button>
                        </div>
                        ${!isMe ? `<div class="msg-author">${m.Name}</div>` : ''}
                        <div class="msg-text">${linkify(m.Text)}</div>
                        ${m.ImageURL ? `<img src="${m.ImageURL}" class="msg-img" onclick="window.open('${m.ImageURL}', '_blank')">` : ''}
                        <div class="msg-time">${formatTime(m.Timestamp)}</div>
                        <div class="msg-reacts">${reactHtml}</div>
                        <div class="msg-footer">
                            <button onclick="toggleReactPopup('${m.ID}')">😀</button>
                            ${isMe ? `<button onclick="editMsg('${m.ID}')">✏️</button>` : ''}
                        </div>
                    </div>
                </div>
            `;
        }).join("");
        c.scrollTop = c.scrollHeight;
    }

    function toggleReactPopup(msgId) {
        document.querySelectorAll('.react-popup').forEach(p => { if(p.id !== `react-popup-${msgId}`) p.style.display = 'none'; });
        const popup = document.getElementById(`react-popup-${msgId}`);
        popup.style.display = popup.style.display === 'flex' ? 'none' : 'flex';
    }

    async function sendChat() {
        const text = document.getElementById('chatTextInput').value;
        if(!text) return;
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'sendChat', email: currentUser.Email, password: currentUser.password, text: text}) });
        document.getElementById('chatTextInput').value = '';
    }

    async function reactMsg(msgId, emoji) {
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'reactChat', email: currentUser.Email, password: currentUser.password, msgId: msgId, emoji: emoji}) });
        toggleReactPopup(msgId);
    }

    function editMsg(msgId) {
        const newText = prompt("تعديل الرسالة:");
        if(newText !== null) {
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'editChat', email: currentUser.Email, password: currentUser.password, msgId: msgId, text: newText}) });
        }
    }

    async function uploadChatImage() {
        const file = document.getElementById('chatImgInput').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = async () => {
            const formData = new FormData();
            formData.append("key", IMG_API_KEY);
            formData.append("image", reader.result.split(',')[1]);
            try {
                const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
                const data = await res.json();
                if (data.data.url) {
                    await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'sendChat', email: currentUser.Email, password: currentUser.password, text: "📷 صورة", imageUrl: data.data.url}) });
                }
            } catch (e) { alert("فشل رفع الصورة"); }
        };
    }

    async function uploadAvatar() {
        const file = document.getElementById('avatarInput').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = async () => {
            const formData = new FormData();
            formData.append("key", IMG_API_KEY);
            formData.append("image", reader.result.split(',')[1]);
            try {
                const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
                const data = await res.json();
                if (data.data.url) {
                    document.getElementById('settingsAvatar').src = data.data.url;
                    window.tempAvatar = data.data.url;
                }
            } catch (e) { alert("فشل رفع الصورة"); }
        };
    }

    async function updateProfile() {
        const newPass = document.getElementById('newPassInput').value;
        const payload = {
            action: 'updateProfile', email: currentUser.Email, password: currentUser.password,
            newPassword: newPass || "", avatarUrl: window.tempAvatar || ""
        };
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload) });
        alert('تم تحديث الملف الشخصي بنجاح.');
        if(newPass) {
            let u = JSON.parse(localStorage.getItem('zahraaUser'));
            u.password = newPass;
            localStorage.setItem('zahraaUser', JSON.stringify(u));
        }
        location.reload();
    }
</script>

</body>
</html>
