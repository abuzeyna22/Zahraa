<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الزهراء للتطوير العقاري</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f1f5f9; --container-bg: #ffffff; --text-color: #1e293b;
            --header-color: #0f172a; --border-color: #e2e8f0; --primary-color: #0d9488; /* الزهراء لون أخضر/تركواز */
            --danger-color: #ef4444; --success-color: #10b981; --warning-color: #f59e0b;
            --purple-color: #805ad5; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .dark-mode {
            --bg-color: #0f172a; --container-bg: #1e293b; --text-color: #cbd5e0;
            --header-color: #f1f5f9; --border-color: #334155; --primary-color: #14b8a6;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
        * { box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; transition: 0.4s; }

        /* Login Screen */
        .login-overlay { display: flex; position: fixed; inset: 0; background: var(--bg-color); z-index: 2000; justify-content: center; align-items: center; flex-direction: column; }
        .login-box { background: var(--container-bg); padding: 40px; border-radius: 16px; box-shadow: var(--shadow); width: 350px; text-align: center; }
        .logos { display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px; }
        .logos img { height: 50px; object-fit: contain; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-color); color: var(--text-color); box-sizing: border-box; font-family: 'Cairo'; text-align: center; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 15px; font-family: 'Cairo'; background: var(--primary-color); color: white; transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .error-msg { color: var(--danger-color); font-size: 13px; margin-top: 10px; display: none; }

        /* Navbar */
        .navbar { background: var(--container-bg); box-shadow: var(--shadow); padding: 15px 20px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .nav-brand { display: flex; align-items: center; gap: 15px; }
        .nav-brand img { height: 35px; }
        .nav-btn { padding: 8px 12px; border-radius: 8px; font-weight: 600; border: 1px solid var(--border-color); background: transparent; color: var(--text-color); cursor: pointer; font-size: 14px; font-family: 'Cairo'; }
        .danger-btn { background: var(--danger-color); color: white; border: none; }

        /* Board */
        .board-container { padding: 20px; overflow-x: auto; height: calc(100vh - 70px); }
        .tasks-grid { display: flex; gap: 15px; min-width: max-content; padding-bottom: 20px; }
        .column { width: 280px; flex-shrink: 0; background: var(--bg-color); padding: 15px; border-radius: 12px; border: 1px solid var(--border-color); display: flex; flex-direction: column; max-height: 80vh; }
        .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .column-title { font-size: 15px; font-weight: 700; margin: 0; }
        .count-badge { background: var(--border-color); color: var(--text-color); padding: 2px 8px; border-radius: 10px; font-size: 12px; }
        .column-content { overflow-y: auto; flex-grow: 1; padding-left: 5px; }
        .empty-state { font-size: 13px; opacity: 0.5; text-align: center; padding: 20px 0; }

        /* Task Card */
        .task-card { background: var(--container-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; box-shadow: var(--shadow); cursor: pointer; transition: 0.2s; border-right: 4px solid var(--primary-color); }
        .task-card:hover { transform: translateY(-2px); }
        .task-title { font-weight: 700; font-size: 15px; margin-bottom: 8px; }
        .task-meta { font-size: 12px; opacity: 0.8; margin-bottom: 5px; }
        .tag { display: inline-block; background: var(--border-color); padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-left: 5px; margin-bottom: 5px; font-weight: 600; }

        /* FAB */
        .fab { position: fixed; bottom: 30px; left: 30px; width: 60px; height: 60px; background-color: var(--primary-color); border-radius: 50%; box-shadow: 0 6px 20px rgba(13, 148, 136, 0.4); display: flex; justify-content: center; align-items: center; cursor: pointer; border: none; color: white; font-size: 32px; z-index: 90; }
        .fab-chat { left: auto; right: 30px; background-color: var(--purple-color); box-shadow: 0 6px 20px rgba(128, 90, 213, 0.4); }

        /* Modals */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--container-bg); padding: 25px; border-radius: 12px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; margin-bottom: 5px; display: block; font-size: 14px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; background: var(--bg-color); color: var(--text-color); font-family: 'Cairo'; box-sizing: border-box; }
        .platforms-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: var(--border-color); color: var(--text-color); }
        .btn-success { background: var(--success-color); color: white; }

        /* Chat */
        .chat-window { display: none; position: fixed; bottom: 100px; right: 30px; width: 350px; height: 500px; background: var(--container-bg); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); z-index: 100; flex-direction: column; border: 1px solid var(--border-color); }
        .chat-header { padding: 15px; background: var(--purple-color); color: white; border-radius: 12px 12px 0 0; font-weight: 700; }
        .chat-messages { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .chat-msg { background: var(--bg-color); padding: 10px; border-radius: 8px; max-width: 80%; position: relative; }
        .chat-msg.me { align-self: flex-end; background: var(--purple-color); color: white; }
        .chat-msg .author { font-size: 11px; font-weight: 700; margin-bottom: 4px; opacity: 0.8; }
        .chat-msg .text { font-size: 14px; word-break: break-word; }
        .chat-msg img { max-width: 100%; border-radius: 8px; margin-top: 5px; }
        .chat-msg .reacts { margin-top: 5px; font-size: 12px; }
        .chat-input-area { padding: 15px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; align-items: center; }
        .chat-input-area input { flex-grow: 1; }
        .react-btn { background: none; border: 1px solid var(--border-color); border-radius: 4px; cursor: pointer; padding: 2px 6px; font-size: 12px; margin-top: 5px; color: var(--text-color); }

        /* Comments */
        .comment-box { background: var(--bg-color); padding: 10px; border-radius: 6px; margin-bottom: 8px; }
        .comment-author { font-size: 12px; font-weight: 700; color: var(--primary-color); }
        .comment-text { font-size: 13px; margin-top: 4px; }
    </style>
</head>
<body>

<!-- Login Screen -->
<div class="login-overlay" id="loginScreen">
    <div class="login-box">
        <div class="logos">
            <img src="https://alzahraadevelopment.com/wp-content/uploads/2024/12/zahra-logo3-1.png" alt="Zahraa">
            <img src="https://iili.io/CD6dcqg.png" alt="Flux">
        </div>
        <h3 style="margin-top: 0;">بوابة المهام</h3>
        <input type="email" id="emailInput" class="login-input" placeholder="البريد الإلكتروني">
        <input type="password" id="passInput" class="login-input" placeholder="كلمة المرور">
        <button class="btn" onclick="login()">دخول</button>
        <div class="error-msg" id="loginError">بيانات الدخول غير صحيحة</div>
    </div>
</div>

<!-- Navbar -->
<div class="navbar" style="display: none;" id="appNavbar">
    <div class="nav-brand">
        <img src="https://alzahraadevelopment.com/wp-content/uploads/2024/12/zahra-logo3-1.png" alt="Zahraa" style="height: 30px;">
        <span>إدارة بوابة الزهراء</span>
    </div>
    <div>
        <button class="nav-btn" onclick="toggleDarkMode()">🌙</button>
        <button class="nav-btn danger-btn" onclick="logout()">خروج</button>
    </div>
</div>

<!-- Board -->
<div class="board-container" id="boardContainer" style="display: none;">
    <div class="tasks-grid" id="tasksGrid">
        <div class="column"><div class="column-header"><h3 class="column-title">محتوى مطلوب</h3><span class="count-badge" id="count-1">0</span></div><div class="column-content" id="col-1"></div></div>
        <div class="column"><div class="column-header"><h3 class="column-title">قيد التنفيذ</h3><span class="count-badge" id="count-2">0</span></div><div class="column-content" id="col-2"></div></div>
        <div class="column"><div class="column-header"><h3 class="column-title">مراجعة الأدمن</h3><span class="count-badge" id="count-3">0</span></div><div class="column-content" id="col-3"></div></div>
        <div class="column"><div class="column-header"><h3 class="column-title">مراجعة العميل</h3><span class="count-badge" id="count-4">0</span></div><div class="column-content" id="col-4"></div></div>
        <div class="column"><div class="column-header"><h3 class="column-title">معتمد من العميل</h3><span class="count-badge" id="count-5">0</span></div><div class="column-content" id="col-5"></div></div>
        <div class="column"><div class="column-header"><h3 class="column-title">تم النشر</h3><span class="count-badge" id="count-6">0</span></div><div class="column-content" id="col-6"></div></div>
    </div>
</div>

<button class="fab" onclick="openTaskModal()" id="fabAdd" style="display: none;">+</button>
<button class="fab fab-chat" onclick="toggleChat()" id="fabChat" style="display: none;">💬</button>

<!-- Chat Window -->
<div class="chat-window" id="chatWindow">
    <div class="chat-header">غرفة الدردشة الداخلية</div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="file" id="chatImgInput" accept="image/*" style="display: none" onchange="uploadChatImage()">
        <button class="nav-btn" onclick="document.getElementById('chatImgInput').click()">📷</button>
        <input type="text" id="chatTextInput" placeholder="اكتب رسالة..." onkeypress="if(event.key==='Enter') sendChat()">
        <button class="btn" style="width: auto; padding: 10px;" onclick="sendChat()">➤</button>
    </div>
</div>

<!-- Add Task Modal -->
<div class="modal-overlay" id="taskModal">
    <div class="modal-content">
        <h3>إنشاء مهمة جديدة</h3>
        <div class="form-group">
            <label>عنوان المهمة</label>
            <input type="text" id="taskTitle">
        </div>
        <div class="form-group">
            <label>نوع المهمة</label>
            <select id="taskType">
                <option value="انشارات">انشارات</option>
                <option value="ستوري">ستوري</option>
                <option value="ريل">ريل</option>
                <option value="ريفيو عميل">ريفيو عميل</option>
                <option value="أخرى">أخرى</option>
            </select>
        </div>
        <div class="form-group">
            <label>المنصات</label>
            <div class="platforms-grid">
                <label><input type="checkbox" value="فيسبوك"> فيسبوك</label>
                <label><input type="checkbox" value="انستجرام"> انستجرام</label>
                <label><input type="checkbox" value="يوتيوب"> يوتيوب</label>
                <label><input type="checkbox" value="تيك توك"> تيك توك</label>
                <label><input type="checkbox" value="الويبسايت"> الويبسايت</label>
                <label><input type="checkbox" value="أخرى"> أخرى</label>
            </div>
        </div>
        <div class="form-group">
            <label>الوصف المطلوب</label>
            <textarea id="taskDesc" rows="3"></textarea>
        </div>
        <div class="form-group">
            <label>تاريخ النشر المطلوب</label>
            <input type="date" id="taskDate">
        </div>
        <div class="form-group">
            <label>رابط الخامات (Drive)</label>
            <input type="url" id="taskRawLink" placeholder="https://...">
        </div>
        <div class="modal-actions">
            <button class="btn btn-cancel" onclick="closeModal('taskModal')">إلغاء</button>
            <button class="btn btn-success" onclick="addTask()">حفظ المهمة</button>
        </div>
    </div>
</div>

<!-- Task Details Modal -->
<div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
        <h3 id="detailsTitle"></h3>
        <div id="detailsBody"></div>
        <div class="modal-actions" id="detailsActions"></div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycby6QWEBFZizMNhFk4LkgFk_-DhFjNx_gHWgG4RoDGGqE9ON-cq0Sc2BhVf5Nc8ngyM/exec";
    const IMG_API_KEY = "71307118640265da76172e90445b208b";
    const STATUS_MAP = {
        "محتوى مطلوب": 1, "قيد التنفيذ": 2, "مراجعة الأدمن": 3,
        "مراجعة العميل": 4, "معتمد من العميل": 5, "تم النشر": 6
    };
    
    let currentUser = null;
    let boardData = { tasks: [], comments: [], chat: [] };

    function toggleDarkMode() {
        document.body.classList.toggle('dark-mode');
        localStorage.setItem('zahraaDark', document.body.classList.contains('dark-mode'));
    }
    if (localStorage.getItem('zahraaDark') === 'true') document.body.classList.add('dark-mode');

    async function login() {
        const email = document.getElementById('emailInput').value;
        const pass = document.getElementById('passInput').value;
        document.getElementById('loginError').style.display = 'none';
        try {
            const res = await fetch(`${API_URL}?action=login&email=${email}&password=${pass}`);
            const data = await res.json();
            if (data.status === 'success') {
                currentUser = data.user;
                currentUser.password = pass; // Keep for auth
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('appNavbar').style.display = 'flex';
                document.getElementById('boardContainer').style.display = 'block';
                document.getElementById('fabAdd').style.display = 'flex';
                document.getElementById('fabChat').style.display = 'flex';
                fetchData();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        } catch (e) { document.getElementById('loginError').style.display = 'block'; }
    }

    function logout() { location.reload(); }

    async function fetchData() {
        if (!currentUser) return;
        try {
            const res = await fetch(`${API_URL}?action=getBoardData&email=${currentUser.Email}&password=${currentUser.password}`);
            const data = await res.json();
            if (data.status === 'success') {
                boardData = data;
                renderBoard();
                renderChat();
            }
        } catch (e) { console.error(e); }
    }
    setInterval(fetchData, 5000); // Polling every 5 seconds

    function renderBoard() {
        for (let i = 1; i <= 6; i++) document.getElementById(`col-${i}`).innerHTML = '';
        const counts = [0,0,0,0,0,0];

        boardData.tasks.forEach(t => {
            const colNum = STATUS_MAP[t.Status] || 1;
            counts[colNum-1]++;
            const card = document.createElement('div');
            card.className = 'task-card';
            card.onclick = () => openDetails(t.ID);
            card.innerHTML = `
                <div class="task-title">${t.Title}</div>
                <div class="task-meta">👤 ${t.Creator}</div>
                <div class="task-meta">📅 ${t.PublishDate || 'غير محدد'}</div>
                <div><span class="tag">${t.Type}</span></div>
                <div style="font-size:11px; margin-top:5px; opacity:0.7;">${t.Platforms}</div>
            `;
            document.getElementById(`col-${colNum}`).appendChild(card);
        });

        for (let i = 1; i <= 6; i++) {
            if (counts[i-1] === 0) document.getElementById(`col-${i}`).innerHTML = '<div class="empty-state">لا توجد مهام</div>';
            document.getElementById(`count-${i}`).innerText = counts[i-1];
        }
    }

    function openTaskModal() { document.getElementById('taskModal').style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    async function addTask() {
        const platforms = Array.from(document.querySelectorAll('.platforms-grid input:checked')).map(c => c.value);
        const payload = {
            action: 'addTask', email: currentUser.Email, password: currentUser.password,
            title: document.getElementById('taskTitle').value,
            type: document.getElementById('taskType').value,
            platforms: platforms,
            description: document.getElementById('taskDesc').value,
            publishDate: document.getElementById('taskDate').value,
            rawLink: document.getElementById('taskRawLink').value
        };
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify(payload) });
        closeModal('taskModal');
        fetchData();
    }

    function openDetails(taskId) {
        const t = boardData.tasks.find(x => x.ID === taskId);
        if (!t) return;
        document.getElementById('detailsTitle').innerText = t.Title;
        
        let html = `
            <div class="form-group"><label>النوع:</label><p>${t.Type}</p></div>
            <div class="form-group"><label>المنصات:</label><p>${t.Platforms}</p></div>
            <div class="form-group"><label>الوصف:</label><p>${t.Description}</p></div>
            <div class="form-group"><label>تاريخ النشر:</label><p>${t.PublishDate}</p></div>
            <div class="form-group"><label>رابط الخامات:</label><a href="${t.RawLink}" target="_blank">${t.RawLink || 'لا يوجد'}</a></div>
            <div class="form-group"><label>رابط المعاينة (للمونتير):</label><input type="url" id="reviewLinkInput" value="${t.ReviewLink || ''}" placeholder="ضع رابط المعاينة هنا"></div>
            <hr>
            <h4>التعليقات</h4>
            <div id="commentsList"></div>
            <div class="form-group" style="display: flex; gap: 10px; margin-top: 10px;">
                <input type="text" id="commentInput" placeholder="اكتب تعليقاً (استخدم @ للمنشن)">
                <button class="btn btn-success" style="width: auto; padding: 10px;" onclick="addComment('${t.ID}')">إرسال</button>
            </div>
        `;
        document.getElementById('detailsBody').innerHTML = html;

        const comments = boardData.comments.filter(c => c.TaskID === taskId);
        document.getElementById('commentsList').innerHTML = comments.map(c => `<div class="comment-box"><div class="comment-author">${c.Name}</div><div class="comment-text">${c.Text}</div></div>`).join('');

        // Actions based on role
        let actions = `<button class="btn btn-cancel" onclick="closeModal('detailsModal')">إغلاق</button>`;
        if (currentUser.Role === 'Admin' || currentUser.Role === 'Mustafa') {
            actions += `<button class="btn btn-success" onclick="updateLink('${t.ID}')">حفظ رابط المعاينة</button>`;
        }
        
        const currentCol = STATUS_MAP[t.Status];
        if (currentUser.Role === 'Admin' || currentUser.Role === 'Mustafa') {
            if (currentCol < 3) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'مراجعة الأدمن')">رفع للأدمن</button>`;
            if (currentCol === 3) actions += `<button class="btn" onclick="moveTask('${t.ID}', 'مراجعة العميل')">رفع للعميل</button>`;
            if (currentCol === 5) actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'تم النشر')">تأكيد النشر</button>`;
            actions += `<button class="btn" style="background:var(--warning-color); color:white;" onclick="moveTask('${t.ID}', 'قيد التنفيذ')">إعادة للتنفيذ</button>`;
        }
        if (currentUser.Role === 'Client' && currentCol === 4) {
            actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'معتمد من العميل')">اعتماد</button>`;
            actions += `<button class="btn" style="background:var(--warning-color); color:white;" onclick="moveTask('${t.ID}', 'قيد التنفيذ')">طلب تعديل</button>`;
        }
        if (currentUser.Role === 'Client' && currentCol === 5) {
            actions += `<button class="btn btn-success" onclick="moveTask('${t.ID}', 'تم النشر')">تأكيد النشر</button>`;
        }

        document.getElementById('detailsActions').innerHTML = actions;
        document.getElementById('detailsModal').style.display = 'flex';
    }

    async function updateLink(taskId) {
        const link = document.getElementById('reviewLinkInput').value;
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'updateTaskLinks', email: currentUser.Email, password: currentUser.password, taskId: taskId, reviewLink: link}) });
        alert('تم حفظ الرابط');
        fetchData();
    }

    async function addComment(taskId) {
        const text = document.getElementById('commentInput').value;
        if(!text) return;
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'addComment', email: currentUser.Email, password: currentUser.password, taskId: taskId, text: text}) });
        document.getElementById('commentInput').value = '';
        fetchData();
        openDetails(taskId);
    }

    async function moveTask(taskId, newStatus) {
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'updateTaskStatus', email: currentUser.Email, password: currentUser.password, taskId: taskId, newStatus: newStatus}) });
        closeModal('detailsModal');
        fetchData();
    }

    // Chat Logic
    function toggleChat() {
        const w = document.getElementById('chatWindow');
        w.style.display = w.style.display === 'flex' ? 'none' : 'flex';
        if (w.style.display === 'flex') renderChat();
    }

    function renderChat() {
        const c = document.getElementById('chatMessages');
        c.innerHTML = boardData.chat.map(m => {
            const isMe = m.Email === currentUser.Email;
            const reacts = JSON.parse(m.Reactions || "{}");
            let reactHtml = Object.entries(reacts).map(([email, emoji]) => emoji).join(" ");
            let reactBtns = ["👍", "❤️", "🔥", "😂"].map(emoji => `<button class="react-btn" onclick="reactMsg('${m.ID}', '${emoji}')">${emoji}</button>`).join("");
            
            return `
                <div class="chat-msg ${isMe ? 'me' : ''}">
                    <div class="author">${m.Name} ${m.Edited === 'Yes' ? '(معدلة)' : ''}</div>
                    <div class="text">${m.Text}</div>
                    ${m.ImageURL ? `<img src="${m.ImageURL}" alt="img">` : ''}
                    <div class="reacts">${reactHtml}</div>
                    <div style="margin-top:5px;">${isMe ? `<button class="react-btn" onclick="editMsg('${m.ID}')">✏️ تعديل</button>` : ''}</div>
                    <div>${reactBtns}</div>
                </div>
            `;
        }).join("");
        c.scrollTop = c.scrollHeight;
    }

    async function sendChat() {
        const text = document.getElementById('chatTextInput').value;
        if(!text) return;
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'sendChat', email: currentUser.Email, password: currentUser.password, text: text}) });
        document.getElementById('chatTextInput').value = '';
    }

    async function reactMsg(msgId, emoji) {
        await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'reactChat', email: currentUser.Email, password: currentUser.password, msgId: msgId, emoji: emoji}) });
    }

    function editMsg(msgId) {
        const newText = prompt("تعديل الرسالة:");
        if(newText !== null) {
            fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'editChat', email: currentUser.Email, password: currentUser.password, msgId: msgId, text: newText}) });
        }
    }

    async function uploadChatImage() {
        const file = document.getElementById('chatImgInput').files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onloadend = async () => {
            const formData = new FormData();
            formData.append("key", IMG_API_KEY);
            formData.append("image", reader.result.split(',')[1]);
            try {
                const res = await fetch("https://api.imgbb.com/1/upload", { method: "POST", body: formData });
                const data = await res.json();
                if (data.data.url) {
                    await fetch(API_URL, { method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({action:'sendChat', email: currentUser.Email, password: currentUser.password, text: "صورة مرفقة", imageUrl: data.data.url}) });
                }
            } catch (e) { alert("فشل رفع الصورة"); }
        };
    }
</script>

</body>
</html>
